# Example: serve OxiDNS Dashboard and reverse-proxy the OxiDNS API on the same origin.
server {
    listen 80;
    server_name dns.example.lan;

    # Directory containing the built index.html
    root /var/www/oxidns-dashboard;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Forward /api/* to the OxiDNS management API (api.http.listen).
    location /api/ {
        proxy_pass http://127.0.0.1:9199;   # no trailing slash: keep the /api prefix
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Real-time log stream (SSE)
        proxy_buffering off;
        proxy_read_timeout 1h;

        # When api.http.auth is enabled, hide the browser's native Basic-auth
        # pop-up so the dashboard's own login form is used instead.
        proxy_hide_header WWW-Authenticate;
    }
}
